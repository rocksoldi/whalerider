# Quality Value
#
# A long-only S&P 500 strategy that combines:
# - reasonable valuation,
# - strong profitability,
# - controlled debt, and
# - a positive long-term price trend.
#
# This is a research candidate, not a promise of profit.
# Test it with historical and out-of-sample data before using real money.

NAME: QUALITY_VALUE
SIDE: LONG

# Protect each position with ATR-based exits.
# A wide take-profit target allows strong companies time to compound.
# The one-year holding limit forces the strategy to review old positions.
RISK:
  ATR_INTERVAL: DAY
  ATR_LOOKBACK: 14
  STOP_LOSS_ATR: 3
  TAKE_PROFIT_ATR: 8
  HOLDING_MAX_PERIOD: 365D

# Start with liquid, established S&P 500 companies.
# MIN_MKT_CAP is $10 billion.
# MIN_AVG_VOLUME is one million shares per day.
# MAX_BETA avoids the most volatile companies.
UNIVERSE:
  MARKET_INDICES:
    - NASDAQ100
    - DOW30
    - SP500 

INDICATORS:
  # Price-to-earnings is the first valuation check.
  - NAME: PE_RATIO
    DOMAIN: RATIO
    MEASUREMENT: PriceToEarningsRatio

  # Price-to-free-cash-flow confirms that accounting earnings
  # are supported by cash generated by the business.
  - NAME: FCF_RATIO
    DOMAIN: RATIO
    MEASUREMENT: PriceToFreeCashFlowRatio

  # Gross margin is the profitability and business-quality measure.
  - NAME: GROSS_MARGIN
    DOMAIN: RATIO
    MEASUREMENT: GrossProfitMargin

  # Debt-to-equity limits balance-sheet risk.
  - NAME: DEBT_TO_EQUITY
    DOMAIN: RATIO
    MEASUREMENT: DebtToEquityRatio

  # Daily closing price is used for the trend filter.
  - NAME: PRICE
    DOMAIN: CANDLE
    INTERVAL: DAY

  # The 200-day moving average identifies the long-term trend.
  - NAME: SMA200
    DOMAIN: CANDLE
    INTERVAL: DAY
    STEPS:
      - TYPE: SMA
        LOOKBACK: 200

SIGNALS:
  # Reject loss-making companies and very expensive valuations.
  # Both earnings and free cash flow must be positive.
  - NAME: FAIR_VALUE
    IS: PE_RATIO > 0 AND PE_RATIO < 0.25 AND FCF_RATIO > 0 AND FCF_RATIO < 0.25

  # Require a gross margin greater than 30%.
  - NAME: PROFITABLE
    IS: GROSS_MARGIN > 0.3

  # Negative equity is rejected by the lower bound.
  # Debt-to-equity must remain below 1.5.
  - NAME: CONTROLLED_DEBT
    IS: DEBT_TO_EQUITY >= 0 AND DEBT_TO_EQUITY < 1.5

  # Avoid buying a company while its long-term price trend is falling.
  - NAME: POSITIVE_TREND
    IS: PRICE > SMA200

  # Exit when profitability, cash-flow valuation, or debt becomes weak.
  - NAME: FUNDAMENTALS_WEAKEN
    IS: GROSS_MARGIN < 0.2 OR FCF_RATIO <= 0 OR DEBT_TO_EQUITY > 2

  # Also exit when price falls below its long-term trend.
  - NAME: TREND_BREAKS
    IS: PRICE < SMA200

CRITERIA:
  # Enter only when every value, quality, debt, and trend test passes.
  ENTER:
    IF: FAIR_VALUE AND PROFITABLE AND CONTROLLED_DEBT AND POSITIVE_TREND

  # Exit when either the business weakens or the price trend breaks.
  EXIT:
    IF: FUNDAMENTALS_WEAKEN OR TREND_BREAKS
