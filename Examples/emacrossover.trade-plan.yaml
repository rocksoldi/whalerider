# EMA Crossover
#
# A small long-only trend strategy.
# Enter when the fast EMA moves above the slow EMA.
# Exit when the fast EMA moves below the slow EMA.

NAME: EMA_CROSSOVER
SIDE: LONG

RISK:
  ATR_INTERVAL: DAY
  ATR_LOOKBACK: 14
  STOP_LOSS_ATR: 2
  TAKE_PROFIT_ATR: 4
  HOLDING_MAX_PERIOD: 120D

UNIVERSE:
  MARKET_INDICES:
    - SP500
  
INDICATORS:
  
  - NAME: EMA20
    DOMAIN: CANDLE
    INTERVAL: DAY
    STEPS:
      - TYPE: EMA
        LOOKBACK: 20

  - NAME: EMA50
    DOMAIN: CANDLE
    INTERVAL: DAY
    STEPS:
      - TYPE: EMA
        LOOKBACK: 50

  - NAME: SPY_EMA20
    DOMAIN: CANDLE
    INTERVAL: DAY
    EXPLICIT_TICKER: SPY
    STEPS:
      - TYPE: EMA
        LOOKBACK: 20

  - NAME: SPY_EMA50
    DOMAIN: CANDLE
    INTERVAL: DAY
    EXPLICIT_TICKER: SPY
    STEPS:
      - TYPE: EMA
        LOOKBACK: 50  


SIGNALS:

  - NAME: TREND_UP
    IS: EMA20 > EMA50

  - NAME: TREND_DOWN
    IS: EMA20 < EMA50

  - NAME: MARKET_RISK_ON
    IS: SPY_EMA20 > SPY_EMA50

  - NAME: MARKET_RISK_OFF
    IS: SPY_EMA20 < SPY_EMA50     

CRITERIA:
  ENTER:
    IF: TREND_UP AND MARKET_RISK_ON

  EXIT:
    IF: TREND_DOWN OR MARKET_RISK_OFF
