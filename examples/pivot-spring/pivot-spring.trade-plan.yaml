# ------------------------------------------------------------------------------
# PLAN IDENTITY AND DIRECTION
# ------------------------------------------------------------------------------
# Defines a long-only, sequential monthly-pivot spring setup.
NAME: "PIVOT_SPRING_TRADE_PLAN"
SIDE: LONG

# ------------------------------------------------------------------------------
# RISK MANAGEMENT
# ------------------------------------------------------------------------------
# Limits holding to 30 calendar days and prohibits capital replacement.
# Stop and target distances are 1.5 ATR; adverse entry slippage is 0.25 ATR.
# These boundaries are evaluated controls, not guaranteed execution prices.
RISK:
  HOLDING_MAX_PERIOD: 30D
  REPLACEMENT_MODE: NONE
  ATR:
    LOOKBACK: 14
    INTERVAL: DAY
    STOP_LOSS: 1.5
    TAKE_PROFIT: 1.5
    MAX_SLIPPAGE: 0.25

# ------------------------------------------------------------------------------
# MARKET UNIVERSE
# ------------------------------------------------------------------------------
# Restricts trading to stocks with point-in-time NASDAQ-100 membership.
UNIVERSE:
  SECURITY_TYPES:
    - STOCK
  MARKET_INDICES:
    - NASDAQ100

# ------------------------------------------------------------------------------
# INDICATOR CALCULATIONS
# ------------------------------------------------------------------------------
# Daily price observations drive the ordered setup and recovery confirmation.
# Standard S2 pivots refresh at their respective calendar boundaries.
# Fundamental ratios use decimal fractions: 0.15 is 15%; 0.10 is 10%.
INDICATORS:
  - NAME: DAILY_LOW
    DOMAIN: CANDLE
    MEASUREMENT: Low
    INTERVAL: DAY

  - NAME: DAILY_CLOSE
    DOMAIN: CANDLE
    MEASUREMENT: Close
    INTERVAL: DAY

  # Monthly pivots receive a 60-daily-bar calculation history.
  - NAME: MONTHLY_S2
    DOMAIN: CANDLE
    INTERVAL: DAY
    EVALUATION_INTERVAL: MONTH
    STEPS:
      - TYPE: PIVOT
        LOOKBACK: 60
        ARGS:
          TYPE: Standard
          WINDOW_SIZE: MONTH
          LEVEL: S2

  # Weekly pivots receive a 20-daily-bar calculation history.
  - NAME: WEEKLY_S2
    DOMAIN: CANDLE
    INTERVAL: DAY
    EVALUATION_INTERVAL: WEEK
    STEPS:
      - TYPE: PIVOT
        LOOKBACK: 20
        ARGS:
          TYPE: Standard
          WINDOW_SIZE: WEEK
          LEVEL: S2

  # Exposes daily ATR independently of the matching execution-risk calculation.
  - NAME: ATR_14
    DOMAIN: CANDLE
    INTERVAL: DAY
    STEPS:
      - TYPE: ATR
        LOOKBACK: 14

  - NAME: OPERATING_PROFIT_MARGIN
    DOMAIN: RATIO
    MEASUREMENT: OperatingProfitMargin

  - NAME: OPERATING_CASH_FLOW_TO_SALES
    DOMAIN: RATIO
    MEASUREMENT: OperatingCashFlowSalesRatio

# ------------------------------------------------------------------------------
# BOOLEAN SIGNALS
# ------------------------------------------------------------------------------
# All price and fundamental comparisons preserve the requested strict inequalities.
# Unavailable evidence cannot satisfy a setup stage or entry requirement.
SIGNALS:
  - NAME: LOW_ABOVE_MONTHLY_S2
    IS: DAILY_LOW > MONTHLY_S2
    MISSING_DATA: FALSE

  - NAME: LOW_BELOW_MONTHLY_S2
    IS: DAILY_LOW < MONTHLY_S2
    MISSING_DATA: FALSE

  - NAME: CLOSE_ABOVE_WEEKLY_S2
    IS: DAILY_CLOSE > WEEKLY_S2
    MISSING_DATA: FALSE

  - NAME: OPERATING_MARGIN_QUALIFIED
    IS: OPERATING_PROFIT_MARGIN > 0.15
    MISSING_DATA: FALSE

  - NAME: OPERATING_CASH_FLOW_QUALIFIED
    IS: OPERATING_CASH_FLOW_TO_SALES > 0.10
    MISSING_DATA: FALSE

# ------------------------------------------------------------------------------
# SEQUENTIAL ENTRY WORKFLOW
# ------------------------------------------------------------------------------
# First observe a low above monthly S2, then a low below monthly S2.
# Complete entry on a close above weekly S2 with both fundamentals qualifying.
# No signal-based exit is defined; holding and ATR risk controls govern exits.
CRITERIA:
  ENTER:
    IF: LOW_ABOVE_MONTHLY_S2
    NEXT:
      - IF: LOW_BELOW_MONTHLY_S2
        NEXT:
          - IF: CLOSE_ABOVE_WEEKLY_S2 AND OPERATING_MARGIN_QUALIFIED AND OPERATING_CASH_FLOW_QUALIFIED

