# ------------------------------------------------------------------------------
# SIMULATION IDENTITY
# ------------------------------------------------------------------------------
# Identifies the simulation definition without creating dependent definitions.
NAME: "PIVOT_SPRING_SIMULATION"

# ------------------------------------------------------------------------------
# STRATEGY ALLOCATION
# ------------------------------------------------------------------------------
# References the exact, case-sensitive strategy name, not a definition ID.
# The referenced strategy must be deployed in the destination organization.
# No strategy-specific equity-exposure cap is imposed by this simulation.
STRATEGIES:
  - STRATEGY_NAME: "PIVOT_SPRING_STRATEGY"

# ------------------------------------------------------------------------------
# INITIAL ACCOUNT
# ------------------------------------------------------------------------------
# Starts the simulation with $100,000 in cash and account equity.
# Margin configuration is intentionally omitted as requested.
INITIAL_CASH: 100000

# ------------------------------------------------------------------------------
# HISTORICAL PERIOD
# ------------------------------------------------------------------------------
# Covers January 1, 2016 through June 30, 2026, inclusive, in UTC.
# Execution includes FROM and excludes TO.
# TO is midnight UTC on July 1, 2026, including all of June 30.
FROM: 2016-01-01T00:00:00Z
TO: 2026-07-01T00:00:00Z

