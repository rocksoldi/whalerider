# Defines the reusable position-sizing policy.
NAME: "PIVOT_SPRING_RISK_POLICY"

# ------------------------------------------------------------------------------
# POSITION LIMITS
# ------------------------------------------------------------------------------
# Defines per-position value and risk limits as percentages of account equity.
# All percentages are positive integers based on current account equity.
# Actual sizing also respects available buying power and the strategy's
# remaining aggregate allocation capacity.

# Caps the market value of each new position at 30% of account equity.
# This cap is separate from the strategy's aggregate exposure limit.
MAX_POSITION_VALUE_PCT: 30

# Rejects an order if its calculated position value is below 1% of equity.
MIN_POSITION_VALUE_PCT: 1

# Targets a maximum loss budget of 3% of account equity per position.
# With a positive trade-plan STOP_LOSS_ATR and current ATR, this budget
# limits position size using the stop distance and estimated commission.
# Without STOP_LOSS_ATR, value-based sizing occurs first, and the risk
# budget is used to derive a stop-loss price.
# Stops are checked at the trade plan's evaluation interval; gaps, slippage,
# execution delays, and commissions can cause losses to exceed this target.
MAX_POSITION_RISK_PCT: 3

