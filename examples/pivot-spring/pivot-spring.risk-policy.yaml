NAME: PIVOT_SPRING_RISK_POLICY

# ------------------------------------------------------------------------------
# POSITION LIMITS
# ------------------------------------------------------------------------------
# Defines per-position value and risk limits as percentages of account equity.
# Caps each newly sized position at 30% of current account equity.
# This per-position limit remains separate from any strategy-level allocation cap.
MAX_POSITION_VALUE_PCT: 30
# Rejects a newly sized position when its value is below 1% of current equity.
MIN_POSITION_VALUE_PCT: 1
# Targets a maximum loss budget of 3% of current account equity per position.
# With an ATR stop, this limit can constrain position size; otherwise it derives
# a target stop-loss price after value-based sizing.
MAX_POSITION_RISK_PCT: 3

