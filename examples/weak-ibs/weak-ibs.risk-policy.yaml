# POSITION LIMITS
# ------------------------------------------------------------------------------
# Defines per-position value and risk limits as percentages of account equity.
# This policy permits each new position to use up to the full current account
# equity, subject to available buying power and strategy allocation capacity.
NAME: WEAK_IBS_RISK_POLICY
# Caps one new position at 100% of current account equity.
MAX_POSITION_VALUE_PCT: 100
# Targets a maximum loss budget of 100% of current account equity per position.
MAX_POSITION_RISK_PCT: 100

